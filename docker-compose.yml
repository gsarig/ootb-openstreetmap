services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    # The php8.1 tags stopped receiving WordPress updates when PHP 8.1 reached
    # end of life (frozen at 6.9).
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_test
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/ootb-openstreetmap
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 12

  cli:
    image: wordpress:cli-php8.3
    restart: "no"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_test
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/ootb-openstreetmap
      - ./docker/php.ini:/usr/local/etc/php/conf.d/ootb-memory.ini
    entrypoint: ["tail", "-f", "/dev/null"]

  # Tool services run as the host user when .env sets HOST_UID/HOST_GID, so files
  # they write into the mounted clone stay owned by that user. Without .env (CI)
  # they keep running as root.
  composer:
    image: composer:2
    restart: "no"
    profiles: ["tools"]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      HOME: /tmp
      COMPOSER_HOME: /tmp
    volumes:
      - .:/app
    working_dir: /app

  node:
    image: node:24-alpine
    restart: "no"
    profiles: ["tools"]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    working_dir: /app

  # The image tag must match the @playwright/test version in package-lock.json;
  # .env's PW_VERSION overrides the default, which must be bumped with the lockfile.
  # A required variable here would break every other compose command when unset.
  # Host networking lets the browser reach WordPress on localhost:8080.
  playwright:
    image: mcr.microsoft.com/playwright:v${PW_VERSION:-1.61.1}-noble
    restart: "no"
    profiles: ["tools"]
    network_mode: host
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
    volumes:
      - .:/app
    working_dir: /app

volumes:
  db_data:
  wp_data:
